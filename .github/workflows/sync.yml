name: sync
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - run: |
          git config user.name "afterlight-commons-sync"
          git config user.email "sync@commons.tryafterlight.com"
          git add -A
          git diff --cached --quiet || (git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
